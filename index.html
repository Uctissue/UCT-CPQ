function otpGet(){try{return JSON.parse(localStorage.getItem(OTP_KEY)||'{}')}catch(e){return{}}}
function otpSet(d){localStorage.setItem(OTP_KEY,JSON.stringify(d))}
function otpGenerate(qid,role){
  const code=String(Math.floor(100000+Math.random()*900000));
  const store=otpGet();
  store[qid+'_'+role]={code,expires:Date.now()+OTP_VALIDITY_MS};
  otpSet(store);return code;
}
function otpVerify(qid,role,input){
  const store=otpGet();const entry=store[qid+'_'+role];
  if(!entry)return false;
  if(Date.now()>entry.expires){delete store[qid+'_'+role];otpSet(store);return false;}
  if(entry.code!==String(input).trim())return false;
  delete store[qid+'_'+role];otpSet(store);return true;
}

function calcGgRip(nT,ggOp){return Math.ceil(nT*ggOp/6);}
function calcGgViag(nT){return 2*nT;}
function resolveRow(r){

  return{...r,ggRip,ggViag};
}

function scaricaJsonDaIncolla(){
  const area=document.getElementById('json-paste-area');
  if(!area||!area.value.trim()){toast('Incolla prima il testo JSON.','err');return;}
  try{
    const d=JSON.parse(area.value.trim());
    if(!d.quotes)throw new Error('struttura non valida');
    const nome=d.quotes.length>0?'uct-cpq-'+d.quotes[0].propNum+'.json':'uct-cpq-offerta.json';
    const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=nome;a.click();
    toast('File '+nome+' scaricato','ok');
    set({showJsonModal:false});

<div style="display:flex;flex-direction:column;gap:6px">${qs.map(q=>{const sc=SM[q.status]||SM.bozza,tt=cAll(q),nM=(q.selMods||[]).filter(s=>s.qty>0).length;const auth=q.cfok&&q.admk,cur2=getCurr(q);const _mod=cMO(q),_serv=cS(q),_m=q.margine/100,_p=q.provv/100,_a=q.altro/100;const _pL=_m<1?Math.round((_mod.costoBase+_serv.suC+_serv.smC)/(1-_m)):(_mod.costoBase+_serv.suC+_serv.smC);const _garC=Math.round((_pL+_serv.commTot+_serv.tivC+_serv.costiViviTot)*0.021);const _garM=_m<1?Math.round(_garC/(1-_m)):_garC;const _sub=_pL+_mod.met+_garM;const _subP=_p<1?Math.round(_sub/(1-_p)):_sub;const _totFin=_a<1?Math.round(_subP/(1-_a)):_subP;const _cvT=_serv.commTot+_serv.tivC+_serv.costiViviTot;const _cvP=_p<1?Math.round(_cvT/(1-_p)):_cvT;const _cvA=_a<1?Math.round(_cvP/(1-_a)):_cvP;const _totComm=_totFin+_cvA;const totD=cur2.code==='EUR'?fmtE(_totComm):cur2.sym+' '+Math.round(_totComm*cur2.rate).toLocaleString('it-IT');const tl2=tL(q.lineaTipoId);const tch2=techL(q.lineaTechId);
return`<div style="background:#fff;border:1px solid #E8E6E0;border-left:4px solid ${auth?'#3d9e28':q.status==='emesso'?'#F08A05':'#E8E6E0'};border-radius:3px;padding:13px 16px;cursor:pointer" onmouseover="this.style.borderLeftColor='#F08A05'" onmouseout="this.style.borderLeftColor='${auth?'#3d9e28':q.status==='emesso'?'#F08A05':'#E8E6E0'}'" onclick="openQ('${q.id}')"><div style="display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-family:'Barlow',sans-serif;font-size:15px;font-weight:600">${q.propNum||'—'}</span><span style="font-family:Barlow Condensed,sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 9px;border-radius:2px;background:${sc.bg};color:${sc.c};border-left:2px solid ${sc.b}">${sc.l}</span><span style="font-size:11px;font-weight:500">v${q.ver}</span>${tl2?`<span style="font-family:Barlow Condensed,sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 8px;background:#3D3D3C;color:#fff;border-radius:2px">${tl2}</span>`:''} ${tch2?`<span style="font-family:Barlow Condensed,sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 8px;background:#E8EFF7;color:#1a4f82;border-radius:2px">${tch2}</span>`:''} ${auth?`<span style="font-family:Barlow Condensed,sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 8px;background:#E8F5E3;color:#1a5212;border-left:2px solid #3d9e28">✓ Auth.</span>`:''}</div><div style="font-size:13px;margin-top:3px;font-weight:500">${q.clientName||'Cliente non specificato'}${q.clientNazione?' ('+q.clientNazione+')':''}${q.clientRef?' · '+q.clientRef:''}</div><div class="lbl2" style="font-size:10px;margin-top:2px">${nM} moduli · ${new Date(q.updatedAt).toLocaleDateString('it-IT')}</div></div><div style="text-align:right;flex-shrink:0"><div style="font-size:16px;font-weight:700;color:#F08A05">${totD}</div><div class="lbl2" style="font-size:10px">${cur2.code}</div></div><div style="display:flex;flex-direction:column;gap:4px" onclick="event.stopPropagation()"><button data-qidc="${q.id}" onclick="dupQCliente(this.dataset.qidc)" style="padding:4px 8px;border-radius:3px;font-size:11px;font-family:Barlow Condensed,sans-serif;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap"><i class="ti ti-user-plus" style="font-size:12px"></i> Nuovo cliente</button><button data-qidr="${q.id}" onclick="dupQRevisione(this.dataset.qidr)" style="padding:4px 8px;border-radius:3px;font-size:11px;font-family:Barlow Condensed,sans-serif;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap"><i class="ti ti-versions" style="font-size:12px"></i> Revisione</button><button data-qid="${q.id}" onclick="delQ(this.dataset.qid)" style="padding:4px 8px;border-radius:3px;color:#c0200a;border-color:#F0C8C8;font-size:11px;font-family:Barlow Condensed,sans-serif;font-weight:600;display:flex;align-items:center;gap:4px"><i class="ti ti-trash" style="font-size:12px"></i> Elimina</button></div></div></div>`;}).join('')}</div></div>`;}

function newQ(){const q=mkQ({propNum:'UCT26.P.3000.0'});S.quotes=[q,...S.quotes];S.qid=q.id;S.pg='config';S.step='cliente';S.srch='';S.grp={};S.mod={};S.suggFiltro=null;S.suggTipoId=null;S.showRateForm=false;S.rateFormNazione='';save();paint();}
function openQ(id){S.qid=id;S.pg='config';S.step='cliente';S.srch='';S.grp={};S.mod={};S.showRateForm=false;const q=S.quotes.find(x=>x.id===id);S.suggFiltro=q?.lineaTipoId!=null?false:null;S.suggTipoId=q?.lineaTipoId??null;paint();}
function dupQCliente(id){
  const src=S.quotes.find(q=>q.id===id);if(!src)return;
  // Formato atteso: UCT26.P.3000.0  →  prefisso = UCT26.P  numero = 3000  rev = 0
  const parts=src.propNum.split('.');
  // Le ultime due parti sono numero e revisione; tutto prima è prefisso
  const rev=parts.pop();          // rimuove la revisione finale (es. "0")
  const numStr=parts.pop();       // rimuove il numero progressivo (es. "3000")
  const prefix=parts.join('.');   // es. "UCT26.P"
  // Trova il numero più alto già usato per questo prefisso
  const maxNum=S.quotes.reduce((mx,q)=>{
    const p=q.propNum.split('.');
    if(p.length<2)return mx;
    const r=p.pop();const n=parseInt(p.pop())||0;
    return n>mx?n:mx;
  },parseInt(numStr)||0);
  const newPropNum=prefix+'.'+(maxNum+1)+'.0';
  const q=mkQ({...JSON.parse(JSON.stringify(src)),
    id:Date.now().toString(),ver:1,
    createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),
    status:'bozza',cfok:false,admk:false,cfokTs:null,admkTs:null,cfokLog:null,admkLog:null,
    propNum:newPropNum,clientName:'',clientRef:'',clientNazione:''
  });
  S.quotes=[q,...S.quotes];S.qid=q.id;S.pg='config';S.step='cliente';
  S.suggFiltro=src.lineaTipoId!=null?false:null;S.suggTipoId=src.lineaTipoId??null;
  S.showRateForm=false;save();paint();
}
function dupQRevisione(id){
  const src=S.quotes.find(q=>q.id===id);if(!src)return;
  // Formato: UCT26.P.3000.0 → incrementa solo l'ultima parte (revisione)
  const parts=src.propNum.split('.');
  const revStr=parts.pop();       // rimuove revisione corrente (es. "0")
  const base=parts.join('.');     // es. "UCT26.P.3000"
  // Trova la revisione più alta già esistente per questo numero base
  const maxRev=S.quotes.reduce((mx,q)=>{
    const p=q.propNum.split('.');
    const r=parseInt(p.pop())||0;
    if(p.join('.')===base&&r>mx)return r;
    return mx;
  },parseInt(revStr)||0);
  const newPropNum=base+'.'+(maxRev+1);
  const q=mkQ({...JSON.parse(JSON.stringify(src)),
    id:Date.now().toString(),ver:src.ver+1,
    createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),
    status:'revisione',cfok:false,admk:false,cfokTs:null,admkTs:null,cfokLog:null,admkLog:null,
    propNum:newPropNum
  });
  S.quotes=[q,...S.quotes];S.qid=q.id;S.pg='config';S.step='cliente';
  S.suggFiltro=src.lineaTipoId!=null?false:null;S.suggTipoId=src.lineaTipoId??null;
  S.showRateForm=false;save();paint();
}
function delQ(id){showConfirm('Vuoi eliminare questa offerta? L\u2019operazione non pu\u00f2 essere annullata.',function(){S.quotes=S.quotes.filter(function(q){return q.id!==id;});if(S.qid===id){S.qid=null;S.pg='list';}save();paint();});}
function tGrp(cod){S.grp={...S.grp,[cod]:!S.grp[cod]};paint();}
function tMod(midx){S.mod={...S.mod,[midx]:!S.mod[midx]};paint();}
function esportaTutto(){const d=lsGet();const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='uct-cpq-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Backup esportato','ok');}
function importaJSON(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const d=JSON.parse(e.target.result);if(!d.quotes)throw new Error();if(!window.confirm('Importare '+d.quotes.length+' offerte? I dati attuali verranno sostituiti.'))return;lsSet(d);
boot();toast(`${d.quotes.length} offerte importate`,'ok');}catch(err){toast('File non valido.','err');}input.value='';};reader.readAsText(file);}

boot();
