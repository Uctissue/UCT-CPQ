async function sbLoadQuotes(){
  const {data,error}=await sb.from('quotes').select('*').order('updated_at',{ascending:false});
  if(error){toast('Caricamento dati fallito: '+error.message,'err',6000);return;}
  sbRemoteIds=new Set();sbLastPersist={};
  S.quotes=(data||[]).map(function(r){sbRemoteIds.add(r.id);sbLastPersist[r.id]=r.data&&r.data.updatedAt;return Object.assign({},r.data,{id:r.id,created_by:r.created_by,commerciale_email:r.commerciale_email});});
}
function sbApplyRow(payload){
  const row=payload.new||payload.old;if(!row)return;
  if(payload.eventType==='DELETE'){S.quotes=S.quotes.filter(function(q){return q.id!==row.id;});sbRemoteIds.delete(row.id);paint();return;}
  const q=Object.assign({},row.data,{id:row.id,created_by:row.created_by,commerciale_email:row.commerciale_email});
  sbRemoteIds.add(q.id);sbLastPersist[q.id]=q.updatedAt;
  const i=S.quotes.findIndex(function(x){return x.id===q.id;});
  if(i<0){S.quotes=[q].concat(S.quotes);}
  else if(S.qid===q.id&&S.pg==='config'){
    S.quotes[i]=Object.assign({},S.quotes[i],{status:q.status,cfok:q.cfok,admk:q.admk,cfokTs:q.cfokTs,admkTs:q.admkTs,cfokLog:q.cfokLog,admkLog:q.admkLog,cfokRifiuto:q.cfokRifiuto,admkRifiuto:q.admkRifiuto,cfokRifiutoTs:q.cfokRifiutoTs,admkRifiutoTs:q.admkRifiutoTs,cfokRifiutoLog:q.cfokRifiutoLog,admkRifiutoLog:q.admkRifiutoLog});
  } else {S.quotes[i]=q;}
  paint();
}
function sbSubscribe(){
  if(sbChannel)return;

}
async function sbPersistQuote(q){
  const row={id:q.id,data:q,status:q.status||null,commerciale_email:q.commerciale_email||null,updated_at:new Date().toISOString()};
  if(sbRemoteIds.has(q.id)){
    const {error}=await sb.from('quotes').update(row).eq('id',q.id);
    if(error){toast('Salvataggio fallito: '+error.message,'err',6000);return false;}
  }else{
    row.created_by=q.created_by||(ME&&ME.id);
    const {error}=await sb.from('quotes').insert(row);
    if(error){toast('Creazione offerta fallita: '+error.message,'err',6000);return false;}
    sbRemoteIds.add(q.id);
  }
  sbLastPersist[q.id]=q.updatedAt;return true;
}
async function sbSyncChanged(){
  if(!ME)return;

const LS_KEY='uct_cpq_v1';
const OTP_KEY='uct_cpq_otp';
function lsGet(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'{}')}catch(e){return{}}}
function lsSet(d){try{localStorage.setItem(LS_KEY,JSON.stringify(d))}catch(e){}}
function otpGet(){try{return JSON.parse(localStorage.getItem(OTP_KEY)||'{}')}catch(e){return{}}}
function otpSet(d){localStorage.setItem(OTP_KEY,JSON.stringify(d))}
function otpGenerate(qid,role){
  const code=String(Math.floor(100000+Math.random()*900000));
  const store=otpGet();
  store[qid+'_'+role]={code,expires:Date.now()+OTP_VALIDITY_MS};
  otpSet(store);return code;
}
function otpVerify(qid,role,input){
  const store=otpGet();const entry=store[qid+'_'+role];
  if(!entry)return false;
  if(Date.now()>entry.expires){delete store[qid+'_'+role];otpSet(store);return false;}
  if(entry.code!==String(input).trim())return false;
  delete store[qid+'_'+role];otpSet(store);return true;
}

  var q3idx=MB.findIndex(function(b){return b.cod==='Q3';});

  var hasN=selMods.some(function(s){return s.qty>0&&MB[s.midx]&&MB[s.midx].cod==='N';});
  var hasQ2=selMods.some(function(s){return s.qty>0&&MB[s.midx]&&MB[s.midx].cod==='Q2';});
  var hasQ3=selMods.some(function(s){return s.qty>0&&MB[s.midx]&&MB[s.midx].cod==='Q3';});
  var msgs=[];
  var result=[].concat(selMods);
  if(hasM&&!hasQ2&&q2idx>=0){

  }

    msgs.push('Quadro Tubiera (Q3) aggiunto automaticamente perché è presente un modulo Tubiera (N)');
  }
  // Rimuovi Q2 se non ci sono più M
  if(!hasM&&hasQ2){
    result=result.filter(function(s){return !(MB[s.midx]&&MB[s.midx].cod==='Q2');});
    msgs.push('Quadro Troncatore (Q2) rimosso automaticamente: nessun modulo Troncatore (M) presente');
  }
  // Rimuovi Q3 se non ci sono più N
  if(!hasN&&hasQ3){
    result=result.filter(function(s){return !(MB[s.midx]&&MB[s.midx].cod==='Q3');});
    msgs.push('Quadro Tubiera (Q3) rimosso automaticamente: nessun modulo Tubiera (N) presente');
  }
  if(msgs.length>0){S.autoLinkMsg=msgs.join(' | ');setTimeout(function(){S.autoLinkMsg=null;paint();},6000);}
  return result;
}

  const _cvT=_serv.commTot+_serv.tivC+_serv.costiViviTot;

  const _cvA=_a<1?Math.round(_cvP/(1-_a)):_cvP;
  const _totComm=_totFin+_cvA;

async function spLoad(token){const resp=await fetch(SP_DATA_URL,{headers:{'Authorization':'Bearer '+token}});if(resp.status===404)return{};if(!resp.ok)throw new Error('Lettura SharePoint fallita ('+resp.status+')');return await resp.json();}async function spSave(data,token){const resp=await fetch(SP_DATA_URL,{method:'PUT',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(data)});if(!resp.ok)throw new Error('Scrittura SharePoint fallita ('+resp.status+')');}function startSyncPoll(){if(syncInterval)clearInterval(syncInterval);syncInterval=setInterval(async function(){if(!msalInst||!msalInst.getAllAccounts().length)return;try{const tk=await getGraphToken();const spD=await spLoad(tk);if(spD.quotes!==undefined&&JSON.stringify(spD.quotes)!==JSON.stringify(S.quotes)){S.quotes=spD.quotes;if(spD.extraTAR)Object.assign(TAR,spD.extraTAR);lsSet({quotes:S.quotes,extraTAR:spD.extraTAR||{}});paint();toast('Dati aggiornati da SharePoint.','ok',3000);}}catch(_pE){}},30000);}
async function msalLogin(){
  if(!msalInst){toast('MSAL non disponibile — ricarica la pagina.','err');return;}
  try{
    const resp=await msalInst.loginPopup({scopes:M365.scopes});
    S.msalUser={name:resp.account.name,username:resp.account.username};
    paint();toast('Accesso M365: '+resp.account.name,'ok');
    try{const _lt=await getGraphToken();const _ld=await spLoad(_lt);if(_ld.quotes!==undefined){S.quotes=_ld.quotes;if(_ld.extraTAR)Object.assign(TAR,_ld.extraTAR);}startSyncPoll();save();paint();}catch(_le){console.warn('SP post-login:',_le);}
  }catch(e){if(e.errorCode!=='user_cancelled')toast('Accesso M365 fallito: '+(e.message||e),'err');}
}
async function msalLogout(){
  S.msalUser=null;paint();
  if(msalInst){try{await msalInst.logoutPopup();}catch(e){}}
}
async function getGraphToken(){
  if(!msalInst)throw new Error('MSAL non inizializzato');
  const accs=msalInst.getAllAccounts();
  if(!accs.length)throw new Error('Non autenticato con M365');
  try{
    const r=await msalInst.acquireTokenSilent({scopes:M365.scopes,account:accs[0]});
    return r.accessToken;
  }catch(e){
    const r=await msalInst.acquireTokenPopup({scopes:M365.scopes,account:accs[0]});
    return r.accessToken;
  }
}
async function graphDocxToPdf(docxBlob,fname,token){
  const up=await fetch('https://graph.microsoft.com/v1.0/me/drive/root:/UCT-CPQ-Temp/'+fname+':/content',{method:'PUT',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/vnd.openxmlformats-officedocument.wordprocessingml.document'},body:docxBlob});
  if(!up.ok)throw new Error('Upload docx fallito ('+up.status+')');
  const fi=await up.json();
  const pr=await fetch('https://graph.microsoft.com/v1.0/me/drive/items/'+fi.id+'/content?format=pdf',{headers:{'Authorization':'Bearer '+token}});
  if(!pr.ok)throw new Error('Conversione PDF Graph fallita ('+pr.status+')');
  const pdfBlob=await pr.blob();
  fetch('https://graph.microsoft.com/v1.0/me/drive/items/'+fi.id,{method:'DELETE',headers:{'Authorization':'Bearer '+token}}).catch(function(){});
  return pdfBlob;
}
async function graphSavePdf(pdfBytes,safeRef,token){
  const fname='OFFERTA_'+safeRef+'.pdf';
  const putUrl='https://graph.microsoft.com/v1.0/sites/'+SP_SITE_ID+'/drive/root:/Offerte/'+safeRef+'/'+fname+':/content';
  const resp=await fetch(putUrl,{method:'PUT',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/pdf'},body:pdfBytes});
  if(!resp.ok)throw new Error('Salvataggio SharePoint fallito ('+resp.status+')');
  return fname;
}
async function mergePdfsLib(blob1,blob2){
  const PDFDoc=window.PDFLib.PDFDocument;
  const [b1,b2]=await Promise.all([blob1.arrayBuffer(),blob2.arrayBuffer()]);
  const merged=await PDFDoc.create();
  for(const bytes of[b1,b2]){
    const doc=await PDFDoc.load(bytes);
    const pages=await merged.copyPages(doc,doc.getPageIndices());
    pages.forEach(function(p){merged.addPage(p);});
  }
  return await merged.save();
}

function dlBlob(blob,fname){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fname;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}

function injectDraftWatermark(zip){
  const WM='<w:p><w:pPr><w:pStyle w:val="Header"/></w:pPr><w:r><w:rPr><w:noProof/></w:rPr><w:pict><v:shape xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" type="#_x0000_t136" id="uct_draft_wm" style="position:absolute;left:0;text-align:left;margin-left:0;margin-top:0;width:527.85pt;height:131.95pt;z-index:-251654144;mso-position-horizontal:center;mso-position-horizontal-relative:margin;mso-position-vertical:center;mso-position-vertical-relative:margin;" fillcolor="#C0392B" stroked="f"><v:fill on="t" type="solid"/><v:textpath style="font-family:&quot;Calibri&quot;;font-size:1pt;font-weight:bold" string="DRAFT — TO BE APPROVED" trim="t" fitshape="t"/></v:shape></w:pict></w:r></w:p>';
  Object.keys(zip.files).filter(n=>/^word\/header\d+\.xml$/.test(n)).forEach(n=>{
    const xml=zip.file(n).asText();
    zip.file(n,xml.replace(/<w:hdr[^>]*>/,function(m){return m+WM;}));
  });
}

async function generaDocOfferta(){
  const q=Q();if(!q)return;
  if(!DOCX_COMMERCIAL_B64.startsWith('U')){toast('Template non caricato correttamente.','err',6000);return;}
  if(!window.PizZip||!window.docxtemplater){toast('Librerie documento non disponibili — verifica connessione.','err',6000);return;}
  const ImageModule=window.ImageModule;
  if(!ImageModule){toast('Modulo immagini non disponibile — verifica connessione.','err',6000);return;}
  const mO=cMO(q),serv=cS(q);
  const mg=q.margine/100,pv2=q.provv/100,al=q.altro/100;
  const pL=mg<1?Math.round((mO.costoBase+serv.suC+serv.smC)/(1-mg)):(mO.costoBase+serv.suC+serv.smC);
  const garC=Math.round((pL+serv.commTot+serv.tivC+serv.costiViviTot)*0.021);
  const garM=mg<1?Math.round(garC/(1-mg)):garC;
  const subP=pv2<1?Math.round((pL+mO.met+garM)/(1-pv2)):(pL+mO.met+garM);
  const totFin=al<1?Math.round(subP/(1-al)):subP;
  const cvP=pv2<1?Math.round((serv.commTot+serv.tivC+serv.costiViviTot)/(1-pv2)):(serv.commTot+serv.tivC+serv.costiViviTot);
  const cvA=al<1?Math.round(cvP/(1-al)):cvP;
  const fmtD=(v)=>{if(v==null)return'—';const cur=getCurr(q);return cur.code+' '+Math.round(v*cur.rate).toLocaleString('it-IT');};
  const pvLoad=(v)=>{const wp=pv2<1?Math.round(v/(1-pv2)):v;return al<1?Math.round(wp/(1-al)):wp;};
  const offerDate=new Date(q.updatedAt||new Date()).toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
  const rU=resolveRow(q.comm.rows.U),rV=resolveRow(q.comm.rows.V),rW=resolveRow(q.comm.rows.W);
  const totGgOp=rU.nT*rU.ggOp+rV.nT*rV.ggOp+rW.nT*rW.ggOp;
  const _pngBin=atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=');
  const placeholderImg=new Uint8Array(_pngBin.length);
  for(let _i=0;_i<_pngBin.length;_i++)placeholderImg[_i]=_pngBin.charCodeAt(_i);
  const modules=(q.selMods||[]).filter(s=>s.qty>0).map(sel=>{
    const b=MB[sel.midx];if(!b)return null;
    const r=cMP(sel,q);
    const options=b.opts.map((opt,oidx)=>{
      if(!(sel.opts||[])[oidx])return null;
      const oqty=(sel.optQty||{})[oidx]||1;
      return oqty>1?opt.n+' \xD7'+oqty:opt.n;
    }).filter(Boolean);
    return{moduleName:b.name,moduleCode:b.cod,moduleDescription:b.cat||'',moduleImage:sel.moduleImage||placeholderImg,specs:[],options,_pAlt:r.pAlt,_qty:sel.qty};
  }).filter(Boolean).sort((a,b)=>a.moduleCode.localeCompare(b.moduleCode));
  const summaryRows=modules.map(row=>({module:row.moduleName,qty:String(row._qty)}));
  const data={
    CUSTOMER_NAME:q.clientName||'—',CUSTOMER_COUNTRY:q.clientNazione||'—',
    CONTRACT_REFERENCE:q.propNum||'—',OFFER_DATE:offerDate,SALES_REP:q.commerciale||'—',
    modules,summaryRows,
    TOTAL_OFFER:fmtD(totFin),DISCOUNT:'',FINAL_PRICE:fmtD(totFin),
    COMMISSIONING_LIVE_COSTS:fmtD(cvA),
    TOTAL_OPERATIVE_DAYS:String(totGgOp),
    LIVING_COSTS_INCLUDED:q.livingCostsIncl||'flights, hotel, meals, local transfers'
  };
  const ref=(q.propNum||'Offerta').replace(/[^A-Za-z0-9._-]/g,'_');
  const isDraft=q.status!=='approvato'&&q.status!=='emesso';
  const imageOpts={centered:false,getImage:function(v){return v||placeholderImg;},getSize:function(){return[612,321];}};
  // Generate docx blobs
  let commercialBlob,tcBlob;
  try{
    const zipC=new PizZip(DOCX_COMMERCIAL_B64,{base64:true});
    const docC=new docxtemplater(zipC,{delimiters:{start:'{{',end:'}}'},paragraphLoop:true,linebreaks:true,modules:[new ImageModule(imageOpts)]});
    await docC.renderAsync(data);
    const filledZip=docC.getZip();
    if(isDraft)injectDraftWatermark(filledZip);
    commercialBlob=filledZip.generate({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  }catch(err){console.error('Commercial:',err);toast('Errore template commerciale: '+(err.message||err),'err',8000);return;}
  try{
    const zipT=new PizZip(DOCX_TC_B64,{base64:true});
    const docT=new docxtemplater(zipT,{delimiters:{start:'{{',end:'}}'},paragraphLoop:true,linebreaks:true});
    await docT.renderAsync({CUSTOMER_NAME:data.CUSTOMER_NAME});
    tcBlob=docT.getZip().generate({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  }catch(err){console.error('TC:',err);toast('Errore template T&C: '+(err.message||err),'err',8000);return;}
  // Salvataggio automatico dei due .docx su Supabase Storage
  try{
    var _cn=(q.clientName||'Cliente').replace(/[\\/]/g,'-');
    var _pn=(q.propNum||'Offerta').replace(/[\\/]/g,'-');
    var _ct='application/vnd.openxmlformats-officedocument.wordprocessingml.document';
    var _u1=await sb.storage.from('offerte-pdf').upload(_pn+' ; '+_cn+';1-2.docx',commercialBlob,{upsert:true,contentType:_ct});
    var _u2=await sb.storage.from('offerte-pdf').upload(_pn+' ; '+_cn+';2-2.docx',tcBlob,{upsert:true,contentType:_ct});
    if(_u1.error||_u2.error){toast('Upload storage parziale: '+((_u1.error&&_u1.error.message)||(_u2.error&&_u2.error.message)),'err',7000);}
    else{toast('2 .docx salvati su Supabase Storage.','ok',5000);}
  }catch(_e){console.warn('storage upload',_e);toast('Salvataggio storage fallito: '+(_e&&_e.message),'err',6000);}
  // M365 flow: Graph PDF conversion + SharePoint save
  const m365Ready=msalInst&&msalInst.getAllAccounts().length>0&&window.PDFLib;
  if(m365Ready){
    try{
      toast('Conversione PDF in corso...','ok',3000);
      const token=await getGraphToken();
      const [pdfC,pdfT]=await Promise.all([
        graphDocxToPdf(commercialBlob,ref+'_Commercial.docx',token),
        graphDocxToPdf(tcBlob,ref+'_TC.docx',token)
      ]);
      toast('Unione PDF...','ok',2000);
      const mergedBytes=await mergePdfsLib(pdfC,pdfT);
      toast('Salvataggio su SharePoint...','ok',3000);
      const savedName=await graphSavePdf(mergedBytes,ref,token);
      dlBlob(new Blob([mergedBytes],{type:'application/pdf'}),savedName);
      toast('PDF'+(isDraft?' BOZZA':'')+' salvato su SharePoint e scaricato.','ok',9000);
      return;
    }catch(err){
      console.error('M365 flow:',err);
      toast('Errore M365 ('+err.message+') — scarico .docx come fallback.','err',7000);
    }
  }
  // Fallback: download docx
  dlBlob(commercialBlob,ref+'_Commercial.docx');
  setTimeout(()=>{
    dlBlob(tcBlob,ref+'_TC.docx');
    const draftNote=isDraft?' (bozza — non approvata)':'';
    toast('Scaricati 2 file .docx'+draftNote+(m365Ready?'':' — accedi M365 per PDF diretto.'),'ok',8000);
  },400);
}

sbInit();
</script>
